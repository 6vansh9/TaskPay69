# Supabase project configuration
# https://supabase.com/docs/guides/local-development

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "26MiB"

# Edge Function: auto-release escrow (runs hourly)
[functions.auto-release]
verify_jwt = false

[functions.auto-release.cron]
schedule = "0 * * * *"

# Edge Function: monthly connects refill (runs on 1st of every month at midnight UTC)
[functions.monthly-connects-refill]
verify_jwt = false

[functions.monthly-connects-refill.cron]
schedule = "0 0 1 * *"
